<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施設予約管理システム - reserveapp</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Tailwindのコンソールログやカスタマイズ設定
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- ヘッダーバー -->
    <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-building-circle-check text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">施設予約管理システム</h1>
                    <p class="text-xs text-blue-100 hidden sm:block">体育館・実習室などの利用予約 (reserveapp)</p>
                </div>
            </div>
            
            <!-- ユーザープロファイル & ログイン/ログアウトエリア -->
            <div id="authContainer" class="flex items-center space-x-3">
                <div class="text-xs animate-pulse text-blue-200">認証確認中...</div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- トースト通知エリア -->
        <div id="toast" class="hidden fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl text-white font-medium transition-all duration-300 flex items-center space-x-2">
            <i id="toastIcon" class="fa-solid fa-circle-info"></i>
            <span id="toastMsg">メッセージ</span>
        </div>

        <!-- 未ログイン時のカード -->
        <div id="loggedOutView" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center max-w-lg mx-auto my-12">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">ログインが必要です</h2>
            <p class="text-slate-600 mb-6 text-sm leading-relaxed">施設の予約確認や新規登録を行うには、Googleアカウントでログインしてください。</p>
            <button id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-3">
                <i class="fa-brands fa-google text-lg"></i>
                <span>Googleアカウントでログイン</span>
            </button>
        </div>

        <!-- ログイン時のメインコンテンツ -->
        <div id="loggedInView" class="hidden space-y-8">

            <!-- 予約フォームカード -->
            <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 transition-all">
                <div class="flex items-center space-x-2 border-b border-slate-100 pb-4 mb-5">
                    <i class="fa-solid fa-calendar-plus text-blue-600 text-xl"></i>
                    <h2 class="text-lg font-bold text-slate-800" id="formTitle">新規施設予約</h2>
                </div>

                <!-- エラー表示メッセージ -->
                <div id="errorAlert" class="hidden mb-4 p-4 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm flex items-start space-x-2">
                    <i class="fa-solid fa-triangle-exclamation mt-0.5 flex-shrink-0"></i>
                    <span id="errorMessage">入力内容に問題があります。</span>
                </div>

                <form id="reservationForm" onsubmit="return false;" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- 1. 施設名 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-600" for="facility">施設名 <span class="text-red-500">*</span></label>
                        <select id="facility" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all">
                            <option value="">施設を選択してください</option>
                            <option value="体育館">体育館</option>
                            <option value="実習室A">実習室A</option>
                            <option value="実習室B">実習室B</option>
                            <option value="グラウンド">グラウンド</option>
                            <option value="会議室">会議室</option>
                        </select>
                    </div>

                    <!-- 2. 利用日 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-600" for="date">利用日 <span class="text-red-500">*</span></label>
                        <input type="date" id="date" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all">
                    </div>

                    <!-- 3. 利用時間帯 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-600" for="timeSlot">利用時間帯 <span class="text-red-500">*</span></label>
                        <select id="timeSlot" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all">
                            <option value="">時間帯を選択してください</option>
                            <option value="1時間目 (08:50〜09:40)">1時間目 (08:50〜09:40)</option>
                            <option value="2時間目 (09:50〜10:40)">2時間目 (09:50〜10:40)</option>
                            <option value="3時間目 (10:50〜11:40)">3時間目 (10:50〜11:40)</option>
                            <option value="4時間目 (11:50〜12:40)">4時間目 (11:50〜12:40)</option>
                            <option value="5時間目 (13:25〜14:15)">5時間目 (13:25〜14:15)</option>
                            <option value="6時間目 (14:25〜15:15)">6時間目 (14:25〜15:15)</option>
                            <option value="放課後 (15:30〜17:00)">放課後 (15:30〜17:00)</option>
                        </select>
                    </div>

                    <!-- 4. 予約者名 -->
                    <div class="space-y-1">
                        <label class="block text-xs font-semibold text-slate-600" for="userName">予約者名 <span class="text-red-500">*</span></label>
                        <input type="text" id="userName" placeholder="氏名を入力" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all">
                    </div>

                    <!-- 5. 利用目的 -->
                    <div class="space-y-1 md:col-span-2 lg:col-span-2">
                        <label class="block text-xs font-semibold text-slate-600" for="purpose">利用目的 <span class="text-red-500">*</span></label>
                        <input type="text" id="purpose" placeholder="例: 部活動練習、全校集会準備など" class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm outline-none transition-all">
                    </div>

                    <!-- ボタン領域 -->
                    <div class="md:col-span-2 lg:col-span-3 flex justify-end space-x-3 pt-2">
                        <button type="button" id="cancelEditBtn" class="hidden px-5 py-2.5 bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-700 font-medium rounded-xl text-sm transition-all">
                            キャンセル
                        </button>
                        <button type="button" id="submitBtn" class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium rounded-xl text-sm shadow-md transition-all flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-paper-plane"></i>
                            <span id="submitBtnText">予約を保存する</span>
                        </button>
                    </div>
                </form>
            </section>

            <!-- 絞り込み & 一覧ヘッダー -->
            <section class="space-y-4">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-list-check text-indigo-600 text-xl"></i>
                        <h2 class="text-lg font-bold text-slate-800">予約一覧</h2>
                        <span id="reservationCount" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0件</span>
                    </div>

                    <!-- 絞り込みフィルター -->
                    <div class="flex flex-wrap items-center gap-2">
                        <select id="filterFacility" class="p-2 rounded-xl border border-slate-300 text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">すべての施設</option>
                            <option value="体育館">体育館</option>
                            <option value="実習室A">実習室A</option>
                            <option value="実習室B">実習室B</option>
                            <option value="グラウンド">グラウンド</option>
                            <option value="会議室">会議室</option>
                        </select>

                        <input type="date" id="filterDate" class="p-2 rounded-xl border border-slate-300 text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-blue-500 outline-none">

                        <button id="resetFilterBtn" class="p-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs transition-all flex items-center space-x-1" title="絞り込み解除">
                            <i class="fa-solid fa-rotate-left"></i>
                            <span>リセット</span>
                        </button>
                    </div>
                </div>

                <!-- 予約リスト表示エリア -->
                <div id="reservationsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- JSで一覧カード動的生成 -->
                </div>

                <!-- 該当なしメッセージ -->
                <div id="emptyMessage" class="hidden bg-white rounded-2xl p-12 text-center text-slate-400 border border-slate-200">
                    <i class="fa-regular fa-calendar-xmark text-4xl mb-3"></i>
                    <p class="text-sm font-medium">該当する予約は見つかりません。</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-500">
            &copy; 2026 施設予約管理アプリ (reserveapp)
        </div>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc, 
            doc, 
            updateDoc, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBA2hoMxIi7fHc9e_QyFKhSbYN_qqUERMA",
            authDomain: "exact-tsuishi.firebaseapp.com",
            projectId: "exact-tsuishi",
            storageBucket: "exact-tsuishi.firebasestorage.app",
            messagingSenderId: "371976883187",
            appId: "1:371976883187:web:77c4115e6bcb02dc5c6086",
            measurementId: "G-8X41W56GTN"
        };

        // アバター画像の標準フォールバック (外部通信なしSVG)
        const DEFAULT_AVATAR = "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-1.04-4.83-2.61.03-1.6 3.22-2.48 4.83-2.48s4.8 1.03 4.83 2.48C15.8 18.96 14.03 20 12 20z'/%3E%3C/svg%3E";

        // アプリケーション初期化
        let app, auth, db, provider;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            provider = new GoogleAuthProvider();
        } catch (e) {
            console.warn("Firebase Init fallback:", e);
        }

        // 状態変数
        let currentUser = null;
        let allReservations = [];
        let editingDocId = null;

        // DOM要素参照
        const authContainer = document.getElementById('authContainer');
        const loggedOutView = document.getElementById('loggedOutView');
        const loggedInView = document.getElementById('loggedInView');
        const loginBtn = document.getElementById('loginBtn');

        const facilityInput = document.getElementById('facility');
        const dateInput = document.getElementById('date');
        const timeSlotInput = document.getElementById('timeSlot');
        const userNameInput = document.getElementById('userName');
        const purposeInput = document.getElementById('purpose');
        const submitBtn = document.getElementById('submitBtn');
        const submitBtnText = document.getElementById('submitBtnText');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const formTitle = document.getElementById('formTitle');

        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');

        const reservationsList = document.getElementById('reservationsList');
        const emptyMessage = document.getElementById('emptyMessage');
        const reservationCount = document.getElementById('reservationCount');

        const filterFacility = document.getElementById('filterFacility');
        const filterDate = document.getElementById('filterDate');
        const resetFilterBtn = document.getElementById('resetFilterBtn');

        // デフォルト日付を今日に設定
        if (dateInput) {
            try {
                const today = new Date().toISOString().split('T')[0];
                dateInput.value = today;
            } catch (e) {}
        }

        // Google ログイン処理
        if (loginBtn) {
            loginBtn.addEventListener('click', async () => {
                try {
                    await signInWithPopup(auth, provider);
                    showToast("ログインしました", "success");
                } catch (err) {
                    let msg = "ログイン処理中にエラーが発生しました。";
                    if (err.code === 'auth/popup-blocked') {
                        msg = "ポップアップがブロックされました。許可してください。";
                    }
                    showToast(msg, "error");
                }
            });
        }

        // 認証状態の監視
        if (auth) {
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    if (loggedOutView) loggedOutView.classList.add('hidden');
                    if (loggedInView) loggedInView.classList.remove('hidden');

                    const photoURL = user.photoURL || DEFAULT_AVATAR;
                    const displayName = user.displayName || 'ユーザー';

                    if (authContainer) {
                        authContainer.innerHTML = `
                            <div class="flex items-center space-x-2 bg-white/10 py-1 px-3 rounded-full">
                                <img src="${photoURL}" alt="${escapeHtml(displayName)}" class="w-7 h-7 rounded-full border border-white/40 object-cover" onerror="this.src='${DEFAULT_AVATAR}'">
                                <span class="text-xs font-medium text-white hidden sm:inline">${escapeHtml(displayName)}</span>
                            </div>
                            <button id="logoutBtn" class="bg-red-500/80 hover:bg-red-600 active:scale-95 text-white text-xs px-3 py-1.5 rounded-lg transition-all flex items-center space-x-1">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="hidden sm:inline">ログアウト</span>
                            </button>
                        `;

                        document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                            try {
                                await signOut(auth);
                                showToast("ログアウトしました", "info");
                            } catch (e) {
                                showToast("ログアウト処理に失敗しました", "error");
                            }
                        });
                    }

                    if (userNameInput && !userNameInput.value) {
                        userNameInput.value = user.displayName || '';
                    }

                    // リアルタイムデータ受信スタート
                    listenToReservations();

                } else {
                    if (loggedOutView) loggedOutView.classList.remove('hidden');
                    if (loggedInView) loggedInView.classList.add('hidden');
                    if (authContainer) {
                        authContainer.innerHTML = `
                            <button id="headerLoginBtn" class="bg-white text-blue-600 hover:bg-blue-50 text-xs font-semibold px-3 py-1.5 rounded-lg transition-all shadow-sm">
                                ログイン
                            </button>
                        `;
                        document.getElementById('headerLoginBtn')?.addEventListener('click', () => {
                            loginBtn?.click();
                        });
                    }
                }
            });
        }

        // Firestore リアルタイム取得
        function listenToReservations() {
            if (!db) return;
            const colRef = collection(db, 'reservations');
            
            onSnapshot(colRef, (snapshot) => {
                allReservations = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                
                // 日付＋時間帯で並び替え
                allReservations.sort((a, b) => {
                    if (a.date !== b.date) return (a.date || '').localeCompare(b.date || '');
                    return (a.timeSlot || '').localeCompare(b.timeSlot || '');
                });

                renderReservations();
            }, (error) => {
                showToast("データの読み込みで問題が発生しました", "error");
            });
        }

        // 保存・登録ボタン処理
        if (submitBtn) {
            submitBtn.addEventListener('click', async () => {
                hideError();

                const facility = facilityInput?.value.trim() || '';
                const date = dateInput?.value || '';
                const timeSlot = timeSlotInput?.value.trim() || '';
                const userName = userNameInput?.value.trim() || '';
                const purpose = purposeInput?.value.trim() || '';

                // 1. 必須チェック
                if (!facility || !date || !timeSlot || !userName || !purpose) {
                    showError("すべての必須項目（*）を入力してください。");
                    return;
                }

                // 2. 重複チェック
                const isDuplicate = allReservations.some(item => {
                    if (editingDocId && item.id === editingDocId) return false;
                    return item.facility === facility && item.date === date && item.timeSlot === timeSlot;
                });

                if (isDuplicate) {
                    showError(`「${facility}」の ${date} (${timeSlot}) は既に予約されています。`);
                    return;
                }

                try {
                    if (editingDocId) {
                        // 更新
                        const docRef = doc(db, 'reservations', editingDocId);
                        await updateDoc(docRef, {
                            facility,
                            date,
                            timeSlot,
                            userName,
                            purpose,
                            updatedAt: serverTimestamp()
                        });
                        showToast("予約内容を更新しました！", "success");
                        resetFormState();
                    } else {
                        // 新規登録
                        await addDoc(collection(db, 'reservations'), {
                            facility,
                            date,
                            timeSlot,
                            userName,
                            purpose,
                            createdBy: currentUser ? currentUser.uid : 'anonymous',
                            createdAt: serverTimestamp()
                        });
                        showToast("予約を保存しました！", "success");
                        if (purposeInput) purposeInput.value = '';
                    }
                } catch (err) {
                    showError("保存時にエラーが発生しました。");
                }
            });
        }

        // 予約一覧の描画
        function renderReservations() {
            if (!reservationsList) return;

            const filterFacVal = filterFacility?.value || '';
            const filterDateVal = filterDate?.value || '';

            const filtered = allReservations.filter(item => {
                const matchFac = !filterFacVal || item.facility === filterFacVal;
                const matchDate = !filterDateVal || item.date === filterDateVal;
                return matchFac && matchDate;
            });

            if (reservationCount) reservationCount.textContent = `${filtered.length}件`;

            if (filtered.length === 0) {
                reservationsList.innerHTML = '';
                if (emptyMessage) emptyMessage.classList.remove('hidden');
                return;
            }

            if (emptyMessage) emptyMessage.classList.add('hidden');

            reservationsList.innerHTML = filtered.map(item => {
                let badgeClass = "bg-blue-100 text-blue-800 border-blue-200";
                if (item.facility === '体育館') badgeClass = "bg-emerald-100 text-emerald-800 border-emerald-200";
                if (item.facility?.includes('実習室')) badgeClass = "bg-amber-100 text-amber-800 border-amber-200";
                if (item.facility === 'グラウンド') badgeClass = "bg-purple-100 text-purple-800 border-purple-200";

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between hover:shadow-md transition-all">
                        <div class="space-y-3">
                            <div class="flex items-start justify-between">
                                <span class="text-xs font-bold px-2.5 py-1 rounded-lg border ${badgeClass}">
                                    <i class="fa-solid fa-location-dot me-1"></i>${escapeHtml(item.facility || '')}
                                </span>
                                <span class="text-xs font-semibold text-slate-500">
                                    <i class="fa-regular fa-calendar me-1"></i>${escapeHtml(item.date || '')}
                                </span>
                            </div>

                            <div class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">
                                <i class="fa-regular fa-clock text-blue-600 me-1"></i>${escapeHtml(item.timeSlot || '')}
                            </div>

                            <div class="space-y-1 text-xs text-slate-600">
                                <div><span class="font-semibold text-slate-500">予約者:</span> ${escapeHtml(item.userName || '')}</div>
                                <div><span class="font-semibold text-slate-500">目的:</span> ${escapeHtml(item.purpose || '')}</div>
                            </div>
                        </div>

                        <div class="flex items-center justify-end space-x-2 pt-4 mt-2 border-t border-slate-100">
                            <button onclick="window.editReservation('${item.id}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-xs font-medium rounded-lg transition-all flex items-center space-x-1">
                                <i class="fa-solid fa-pen"></i>
                                <span>編集</span>
                            </button>
                            <button onclick="window.deleteReservation('${item.id}')" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 active:scale-95 text-red-600 text-xs font-medium rounded-lg transition-all flex items-center space-x-1">
                                <i class="fa-solid fa-trash"></i>
                                <span>削除</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // フィルター変更
        filterFacility?.addEventListener('change', renderReservations);
        filterDate?.addEventListener('change', renderReservations);
        resetFilterBtn?.addEventListener('click', () => {
            if (filterFacility) filterFacility.value = '';
            if (filterDate) filterDate.value = '';
            renderReservations();
        });

        // 編集ハンドラ
        window.editReservation = function(id) {
            const item = allReservations.find(r => r.id === id);
            if (!item) return;

            editingDocId = id;
            if (facilityInput) facilityInput.value = item.facility || '';
            if (dateInput) dateInput.value = item.date || '';
            if (timeSlotInput) timeSlotInput.value = item.timeSlot || '';
            if (userNameInput) userNameInput.value = item.userName || '';
            if (purposeInput) purposeInput.value = item.purpose || '';

            if (formTitle) formTitle.textContent = "予約内容の編集";
            if (submitBtnText) submitBtnText.textContent = "変更を保存";
            if (cancelEditBtn) cancelEditBtn.classList.remove('hidden');

            document.getElementById('reservationForm')?.scrollIntoView({ behavior: 'smooth' });
        };

        cancelEditBtn?.addEventListener('click', resetFormState);

        function resetFormState() {
            editingDocId = null;
            if (formTitle) formTitle.textContent = "新規施設予約";
            if (submitBtnText) submitBtnText.textContent = "予約を保存する";
            if (cancelEditBtn) cancelEditBtn.classList.add('hidden');
            hideError();
            
            if (purposeInput) purposeInput.value = '';
            if (currentUser && userNameInput) {
                userNameInput.value = currentUser.displayName || '';
            }
        }

        // 削除ハンドラ
        window.deleteReservation = async function(id) {
            if (!confirm("この予約を削除してもよろしいですか？")) return;

            try {
                await deleteDoc(doc(db, 'reservations', id));
                showToast("予約を削除しました", "info");
                if (editingDocId === id) resetFormState();
            } catch (err) {
                showToast("削除中にエラーが発生しました", "error");
            }
        };

        // UIヘルパー関数
        function showError(msg) {
            if (errorMessage) errorMessage.textContent = msg;
            if (errorAlert) errorAlert.classList.remove('hidden');
        }

        function hideError() {
            if (errorAlert) errorAlert.classList.add('hidden');
        }

        function showToast(msg, type = "info") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            if (!toast || !toastMsg || !toastIcon) return;

            toastMsg.textContent = msg;

            if (type === "success") {
                toast.className = "fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl text-white font-medium bg-emerald-600 flex items-center space-x-2";
                toastIcon.className = "fa-solid fa-circle-check";
            } else if (type === "error") {
                toast.className = "fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl text-white font-medium bg-red-600 flex items-center space-x-2";
                toastIcon.className = "fa-solid fa-triangle-exclamation";
            } else {
                toast.className = "fixed bottom-5 right-5 z-50 px-5 py-3 rounded-xl shadow-xl text-white font-medium bg-slate-800 flex items-center space-x-2";
                toastIcon.className = "fa-solid fa-circle-info";
            }

            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
